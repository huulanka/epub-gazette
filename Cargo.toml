[package]
name = "epub-gazette"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Stateless renderer that turns a JSON newspaper issue into a beautifully typeset, Kindle-ready EPUB"
license = "MIT OR Apache-2.0"
repository = "https://github.com/huulanka/epub-gazette"
readme = "README.md"
keywords = ["epub", "kindle", "newspaper", "ebook", "n8n"]
categories = ["command-line-utilities", "web-programming::http-server"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
epub-builder = "0.8.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "tiff"] }
minijinja = { version = "3.1.0", features = ["serde"] }
resvg = { version = "0.50.0", default-features = false, features = ["text", "raster-images"] }
schemars = { version = "1.2.3", features = ["chrono04"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7.1", features = ["trace", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ttf-parser = "0.25.1"
uuid = { version = "1.29.2", features = ["v5"] }

[dev-dependencies]
http-body-util = "0.1.5"
insta = "1.49.0"
roxmltree = "0.21.2"
tower = { version = "0.5.3", features = ["util"] }
zip = "9.5.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
